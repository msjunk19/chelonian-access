<!DOCTYPE html>
<html lang="en">
<head>
    <title>Access Logs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/style.css">

    <style>
        .log-entry { padding: 8px 12px; border-bottom: 1px solid var(--border); }
        .log-entry:last-child { border-bottom: none; }

        .log-time {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .log-source { font-weight: bold; }
        .log-source.rfid { color: var(--accent-blue); }
        .log-source.wifi { color: var(--accent-green); }
        .log-source.ble  { color: var(--accent-purple); }

        .log-result.success { color: var(--accent-green); }
        .log-result.fail    { color: var(--accent-red); }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .filter-btn {
            padding: 6px 12px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            border-radius: 4px;
            cursor: pointer;
        }

        .filter-btn.active {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <button class="back-btn" onclick="window.location.href='/'">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 19l-7-7 7-7"/>
            </svg>
        </button>

        <h1>Access Logs</h1>

        <button class="icon-btn" onclick="toggleDarkMode()">
            <svg id="sunIcon" class="hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>

            <svg id="moonIcon" class="block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M20.354 15.354A9 9 0 018.646 3.646
                9.003 9.003 0 0012 21
                9.003 9.003 0 008.354-5.646z"/>
            </svg>
        </button>

        <button class="icon-btn" onclick="toggleTimeFormat()" id="timeFormatBtn" title="Toggle 12h/24h">
            <span style="font-size:0.8rem" id="timeFormatLabel">24h</span>
        </button>

    </div>

    <div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;">
        <button class="btn btn-sm filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
        <button class="btn btn-sm filter-btn" data-filter="0" onclick="setFilter(0)">Access</button>
        <button class="btn btn-sm filter-btn" data-filter="1" onclick="setFilter(1)">System</button>
        <button class="btn btn-sm filter-btn" data-filter="2" onclick="setFilter(2)">Debug</button>
    </div>

    <div class="card">

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <p id="logCount" class="status-text">Loading...</p>
            <button class="btn btn-red" onclick="clearLogs()">Clear Logs</button>
        </div>

        <div id="logsContainer">
            <div class="empty-state">Loading logs...</div>
        </div>

    </div>

</div>

<script>

function toggleDarkMode() {
    document.documentElement.classList.toggle('dark');
    localStorage.setItem('darkMode',
        document.documentElement.classList.contains('dark'));
}

function toggleTimeFormat() {
    const is12h = localStorage.getItem('time_12h') === 'true';
    localStorage.setItem('time_12h', is12h ? 'false' : 'true');
    document.getElementById('timeFormatLabel').textContent = is12h ? '24h' : '12h';
    loadLogs();
}

if (localStorage.getItem('time_12h') === 'true') {
    document.getElementById('timeFormatLabel').textContent = '12h';
}

if (localStorage.getItem('darkMode') === 'true' ||
   (!localStorage.getItem('darkMode') &&
    window.matchMedia('(prefers-color-scheme: dark)').matches))
{
    document.documentElement.classList.add('dark');
}

function getStoredPairing() {

    const id = localStorage.getItem('device_id');
    const token = localStorage.getItem('device_token');

    return (id && token) ? { id, token } : null;
}

const sourceNames = ['RFID','WiFi','BLE'];
const resultNames = ['Unknown','Success','Fail'];

let currentFilter = 'all';

function setFilter(filter)
{
    currentFilter = filter;

    document.querySelectorAll('.filter-btn').forEach(btn=>{
        btn.classList.toggle('active',
            btn.dataset.filter === String(filter));
    });

    loadLogs();
}

async function loadLogs()
{
    try
    {
        let url = '/api/logs?timestamp=' + Math.floor(Date.now()/1000);

        if(currentFilter !== 'all')
            url += '&level=' + currentFilter;

        const resp = await fetch(url);
        const logs = await resp.json();

        document.getElementById('logCount').innerText =
            `${logs.length} log entries`;

        const container = document.getElementById('logsContainer');

        if(logs.length === 0)
        {
            container.innerHTML =
                '<div class="empty-state">No logs yet</div>';
            return;
        }

        container.innerHTML = logs.map(log => `

            <div class="log-entry">

                <div class="log-time"
                    data-ts="${log.ts}"
                    data-mode="${log.mode}">
                    ${formatTime(log.ts, log.mode)}
                </div>

                <div>

                    <span class="log-source ${sourceNames[log.source]?.toLowerCase()}">
                        ${sourceNames[log.source] || 'Unknown'}
                    </span>

                    -

                    <span class="log-result ${resultNames[log.result]?.toLowerCase()}">
                        ${resultNames[log.result] || 'Unknown'}
                    </span>

                    <span style="color:var(--text-secondary)">
                        ${log.id}
                    </span>

                </div>

                <div style="margin-top:4px;">
                    ${log.msg}
                </div>

            </div>

        `).join('');

    }
    catch(e)
    {
        document.getElementById('logsContainer').innerHTML =
            '<div class="empty-state">Failed to load logs</div>';
    }
}

function formatTime(ts, mode)
{
    const now = Math.floor(Date.now()/1000);
    const age = now - ts;

    const date = new Date(ts*1000);
    const day = String(date.getDate()).padStart(2,'0');
    const month = String(date.getMonth()+1).padStart(2,'0');
    const year = String(date.getFullYear()).slice(-2);

    let hrs = date.getHours();
    const mins = String(date.getMinutes()).padStart(2,'0');
    const secs = String(date.getSeconds()).padStart(2,'0');

    const use12h = localStorage.getItem('time_12h') === 'true';
    const ampm = hrs >= 12 ? 'PM' : 'AM';
    if(use12h) {
        hrs = hrs % 12;
        if(hrs === 0) hrs = 12;
    }
    const hrsStr = String(hrs).padStart(2,'0');

    const timeOnly = `${hrsStr}:${mins}:${secs}${use12h ? ' ' + ampm : ''}`;

    if(mode === 1) {
        const nowDate = new Date();
        const logDate = new Date(ts * 1000);
        const isToday = nowDate.toDateString() === logDate.toDateString();
        const yesterday = new Date(nowDate);
        yesterday.setDate(yesterday.getDate() - 1);
        const isYesterday = yesterday.toDateString() === logDate.toDateString();

        let dateLabel;
        if(isToday)
            dateLabel = 'Today';
        else if(isYesterday)
            dateLabel = 'Yesterday';
        else
            dateLabel = `${month}-${day}-${year}`;

        if(age < 86400)
            return `${dateLabel} ${timeOnly} (${age}s ago)`;

        return `${dateLabel} ${timeOnly}`;
    }

    if(age < 60)
        return `${age}s ago`;

    if(age < 3600)
        return `${Math.floor(age/60)}m ago`;

    if(age < 86400)
        return `${Math.floor(age/3600)}h ago`;

    return `${month}-${day}-${year} ${hrsStr}:${mins}:${secs}`;
}

function updateRelativeTimes()
{
    const now = Math.floor(Date.now()/1000);

    document.querySelectorAll('.log-time').forEach(el => {

        const ts = parseInt(el.dataset.ts);
        const mode = parseInt(el.dataset.mode);

        if(mode !== 0 && mode !== 1)
            return;

        const age = now - ts;

        const date = new Date(ts * 1000);

        const day = String(date.getDate()).padStart(2,'0');
        const month = String(date.getMonth()+1).padStart(2,'0');
        const year = String(date.getFullYear()).slice(-2);

        let hrs = date.getHours();
        const mins = String(date.getMinutes()).padStart(2,'0');
        const secs = String(date.getSeconds()).padStart(2,'0');

        const use12h = localStorage.getItem('time_12h') === 'true';
        const ampm = hrs >= 12 ? 'PM' : 'AM';
        if(use12h) {
            hrs = hrs % 12;
            if(hrs === 0) hrs = 12;
        }
        const hrsStr = String(hrs).padStart(2,'0');
        const timeOnly = `${hrsStr}:${mins}:${secs}${use12h ? ' ' + ampm : ''}`;

        if(mode === 1) {
            const nowDate = new Date();
            const logDate = new Date(ts * 1000);
            const isToday = nowDate.toDateString() === logDate.toDateString();
            const yesterday = new Date(nowDate);
            yesterday.setDate(yesterday.getDate() - 1);
            const isYesterday = yesterday.toDateString() === logDate.toDateString();

            let dateLabel;
            if(isToday)
                dateLabel = 'Today';
            else if(isYesterday)
                dateLabel = 'Yesterday';
            else
                dateLabel = `${month}-${day}-${year}`;

            if(age < 60)
                el.textContent = `${dateLabel} ${timeOnly} (${age}s ago)`;
            else if(age < 3600)
                el.textContent = `${dateLabel} ${timeOnly} (${Math.floor(age/60)}m ago)`;
            else if(age < 86400)
                el.textContent = `${dateLabel} ${timeOnly} (${Math.floor(age/3600)}h ago)`;
            else
                el.textContent = `${dateLabel} ${timeOnly}`;
        }
        // mode=0: standalone relative only
        else if(age < 60)
            el.textContent = `${age}s ago`;
        else if(age < 3600)
            el.textContent = `${Math.floor(age/60)}m ago`;
        else if(age < 86400)
            el.textContent = `${Math.floor(age/3600)}h ago`;
        else
            el.textContent = timeStr;
    });
}

async function clearLogs()
{
    const pairing = getStoredPairing();

    if(!pairing)
    {
        alert('Not paired');
        return;
    }

    if(!confirm('Clear all logs?'))
        return;

    try
    {
        const resp = await fetch('/api/logs/clear', {

            method:'POST',
            headers:{'Content-Type':'application/json'},

            body: JSON.stringify({

                device_id: pairing.id,
                token: pairing.token

            })

        });

        if(resp.ok)
            loadLogs();
        else
            alert('Failed to clear logs');

    }
    catch(e)
    {
        alert('Failed to clear logs');
    }
}

loadLogs();
setInterval(updateRelativeTimes, 1000);

</script>

</body>
</html>
