<!DOCTYPE html>
<html lang="en">
<head>
    <title>Access Logs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/style.css">
    <style>
        .log-entry { padding: 8px 12px; border-bottom: 1px solid var(--border); }
        .log-entry:last-child { border-bottom: none; }
        .log-time { color: var(--text-secondary); font-size: 0.8rem; }
        .log-source { font-weight: bold; }
        .log-source.rfid { color: var(--accent-blue); }
        .log-source.wifi { color: var(--accent-green); }
        .log-source.ble { color: var(--accent-purple); }
        .log-result.success { color: var(--accent-green); }
        .log-result.fail { color: var(--accent-red); }
        .empty-state { text-align: center; padding: 40px; color: var(--text-secondary); }
        .filter-btn { padding: 6px 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 4px; cursor: pointer; }
        .filter-btn.active { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="window.location.href='/'">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
            </button>
            <h1>Access Logs</h1>
            <button class="icon-btn" onclick="toggleDarkMode()">
                <svg id="sunIcon" class="hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                </svg>
                <svg id="moonIcon" class="block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                </svg>
            </button>
        </div>

        <div style="display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
            <button class="btn btn-sm filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
            <button class="btn btn-sm filter-btn" data-filter="0" onclick="setFilter(0)">Access</button>
            <button class="btn btn-sm filter-btn" data-filter="1" onclick="setFilter(1)">System</button>
            <button class="btn btn-sm filter-btn" data-filter="2" onclick="setFilter(2)">Debug</button>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <p id="logCount" class="status-text">Loading...</p>
                <button class="btn btn-red" onclick="clearLogs()">Clear Logs</button>
            </div>
            <div id="logsContainer">
                <div class="empty-state">Loading logs...</div>
            </div>
        </div>
    </div>

    <script>

        let pageLoadTime = Math.floor(Date.now() / 1000);

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('darkMode', document.documentElement.classList.contains('dark'));
        }
        if (localStorage.getItem('darkMode') === 'true' || 
            (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        function getStoredPairing() {
            const id    = localStorage.getItem('device_id');
            const token = localStorage.getItem('device_token');
            return (id && token) ? { id, token } : null;
        }

        const sourceNames = ['RFID', 'WiFi', 'BLE'];
        const levelNames = ['Access', 'System', 'Debug'];
        const resultNames = ['Unknown', 'Success', 'Fail'];
        let currentFilter = 'all';

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === String(filter));
            });
            loadLogs();
        }

        async function loadLogs() {
            try {
                let url = '/api/logs?timestamp=' + Math.floor(Date.now() / 1000);
                if (currentFilter !== 'all') {
                    url += '&level=' + currentFilter;
                }
                const resp = await fetch(url);
                let logs = await resp.json();
                
                document.getElementById('logCount').innerText = `${logs.length} log entries`;
                
                const container = document.getElementById('logsContainer');
                
                if (logs.length === 0) {
                    container.innerHTML = '<div class="empty-state">No logs yet</div>';
                    return;
                }
                
                container.innerHTML = logs.map(log => `
                    <div class="log-entry">
                        <div class="log-time"
                            data-ts="${log.ts}"
                            data-mode="${log.mode}">
                            ${formatTime(log.ts, log.mode)}
                        </div>
                        <div>
                            <span class="log-source ${sourceNames[log.source]?.toLowerCase()}">${sourceNames[log.source] || 'Unknown'}</span>
                            -
                            <span class="log-result ${resultNames[log.result]?.toLowerCase()}">${resultNames[log.result] || 'Unknown'}</span>
                            <span style="color: var(--text-secondary);">${log.id}</span>
                        </div>
                        <div style="margin-top: 4px;">${log.msg}</div>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('logsContainer').innerHTML = 
                    '<div class="empty-state">Failed to load logs</div>';
            }
        }

        function formatTime(ts, mode) {

            if (mode === 0) {

                const age = pageLoadTime - ts;

                if (age < 60) return `${age}s ago`;
                if (age < 3600) return `${Math.floor(age/60)}m ago`;
                if (age < 86400) return `${Math.floor(age/3600)}h ago`;

                return `${Math.floor(age/86400)}d ago`;
            }

            const date = new Date(ts * 1000);

            const hrs = String(date.getHours()).padStart(2,'0');
            const mins = String(date.getMinutes()).padStart(2,'0');
            const secs = String(date.getSeconds()).padStart(2,'0');
            const month = String(date.getMonth()+1).padStart(2,'0');
            const day = String(date.getDate()).padStart(2,'0');

            return `${date.getFullYear()}-${month}-${day} ${hrs}:${mins}:${secs}`;
        }

        async function clearLogs() {
            const pairing = getStoredPairing();
            if (!pairing) {
                alert('Not paired');
                return;
            }

            if (!confirm('Clear all logs?')) return;

            try {
                const resp = await fetch('/api/logs/clear', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        device_id: pairing.id,
                        token: pairing.token
                    })
                });

                if (resp.ok) {
                    loadLogs();
                } else {
                    alert('Failed to clear logs');
                }
            } catch (e) {
                alert('Failed to clear logs');
            }
        }

        function updateRelativeTimes() {

            const now = Math.floor(Date.now() / 1000);

            document.querySelectorAll('.log-time').forEach(el => {

                const ts = parseInt(el.dataset.ts);
                const mode = parseInt(el.dataset.mode);

                if (mode !== 0) return;

                const age = now - ts;

                if (age < 60) el.textContent = `${age}s ago`;
                else if (age < 3600) el.textContent = `${Math.floor(age/60)}m ago`;
                else if (age < 86400) el.textContent = `${Math.floor(age/3600)}h ago`;
                else el.textContent = `${Math.floor(age/86400)}d ago`;
            });
        }


        loadLogs();
        setInterval(updateRelativeTimes, 1000);
        
    </script>
</body>
</html>
